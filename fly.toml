# fly.toml app configuration file generated for hidenpro on 2026-11-18T14:20:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hidenpro'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
